# A position must have a computer-science keyword in its TITLE to qualify.
# Description matches only add score (keeps ML-heavy posts from other fields —
# astrophysics, bioinformatics, ... — out of a computer-science search).
require_title_anchor: true

# OpenAlex covers ALL CS subfields with structured affiliations + ORCIDs and
# needs no API token (ADS only indexes astronomy/physics).
supervisor_source: openalex
supervisor_ads_db: general
supervisor_arxiv_cat: cs.*

# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 17 = "Computer Science". supervisor_topics drive the AUTHOR
# index query (topics.id OR-ed + country filter) — real researchers ranked by
# h-index and recent activity, not keyword-matched papers.
supervisor_field: 17
supervisor_topics:
  - T10181   # Natural Language Processing Techniques
  - T10320   # Neural Networks and Applications
  - T10036   # Advanced Neural Network Applications
  - T10028   # Topic Modeling
  - T10715   # Distributed and Parallel Computing Systems
  - T10772   # Distributed systems and fault tolerance
  - T10101   # Cloud Computing and Resource Management
  - T10260   # Software Engineering Research
  - T10430   # Software Engineering Techniques and Practices
  - T10317   # Advanced Database Systems and Queries
  - T10734   # Information and Cyber Security
  - T10400   # Network Security and Intrusion Detection
  - T12002   # Computability, Logic, AI Algorithms
  - T10126   # Logic, programming, and type systems
  - T10531   # Advanced Vision and Imaging
  - T10201   # Speech Recognition and Synthesis
  - T10586   # Robotic Path Planning Algorithms
  - T10273   # IoT and Edge/Fog Computing
supervisor_senior_signal: last_author

subfields:
