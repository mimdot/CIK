# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 22 = "Engineering". supervisor_topics drive the AUTHOR index
# query — real researchers ranked by h-index and recent activity.
supervisor_field: 22
supervisor_topics:
  - T13031   # Civil and Structural Engineering Research
  - T10479   # Structural Behavior of Reinforced Concrete
  - T12487   # Structural Engineering and Vibration Analysis
  - T10534   # Structural Health Monitoring Techniques
  - T10360   # Fluid Dynamics and Turbulent Flows
  - T10396   # Fatigue and fracture mechanics
  - T11159   # Manufacturing Process and Optimization
  - T10783   # Additive Manufacturing and 3D Printing Technologies
  - T10472   # Semiconductor materials and devices
  - T10624   # Silicon and Solar Cell Technologies
  - T10069   # Antenna Design and Analysis
  - T10791   # Advanced Control Systems Optimization
  - T10876   # Fault Detection and Control Systems
  - T10299   # Photonic and Optical Devices
  - T10338   # Advanced Sensor and Energy Harvesting Materials
  - T10603   # Smart Grid Energy Management
  - T11091   # Extraction and Separation Processes
  - T11801   # Reservoir Engineering and Simulation Methods
supervisor_senior_signal: last_author

