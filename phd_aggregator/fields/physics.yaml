# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 31 = "Physics and Astronomy". ADS stays the primary source,
# but these topics enable the author-direct OpenAlex fallback.
supervisor_field: 31
supervisor_topics:
  - T10048   # Particle physics theoretical and experimental studies
  - T10093   # Nuclear physics research studies
  - T10523   # Atomic and Molecular Physics
  - T10425   # Cold Atom Physics and Bose-Einstein Condensates
  - T10622   # Quantum Mechanics and Applications
  - T10382   # Quantum and electron transport phenomena
