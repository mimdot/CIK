# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex fields 11 (Agricultural & Biological Sciences) + 13 (Biochemistry,
# Genetics & Molecular Biology). supervisor_topics drive the AUTHOR index
# query — real researchers ranked by h-index and recent activity.
supervisor_field: 11
supervisor_topics:
  - T12713   # Forest Ecology and Biodiversity Studies
  - T10385   # Plant Diversity and Evolution
  - T10451   # Mycorrhizal Fungi and Plant Interactions
  - T10152   # Animal Nutrition and Physiology
  - T10015   # Genomics and Phylogenetic Studies
  - T10885   # Gene expression and cancer classification
  - T10012   # Genetic diversity and population structure
  - T11289   # Single-cell and spatial transcriptomics
  - T10268   # Developmental Biology and Gene Regulation
