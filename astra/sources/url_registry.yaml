    fields:
      astronomy:
        research_field: [34, 35, 37]      # Astronomy / Astrophysics / Astronomy-other
        adjacent: [345]                   # Physics — real astro PhDs get filed here
        status: ok
        verified: 2026-08-15
      physics:
        research_field: [345]
        status: ok
        verified: 2026-08-15
      condensed_matter:
        research_field: [345]
        status: ok
        verified: 2026-08-15
      chemistry:
        research_field: [47]
        status: ok
        verified: 2026-08-15
      biology:
        research_field: [38]
        status: ok
        verified: 2026-08-15
      computer_science:
        research_field: [78, 251]         # Computer science + Information science
        status: ok
        verified: 2026-08-15
      mathematics:
        research_field: [298]
        status: ok
        verified: 2026-08-15
      engineering:
        research_field: [164, 401]        # Engineering + Technology
        status: ok
        verified: 2026-08-15
      economics:
