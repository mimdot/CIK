search_terms:
# ORDER MATTERS AND LENGTH DOES NOT: every board slices this list
# (nature_careers[:6], jobs_ac_uk[:4], LinkedIn[:4], jrecin[:3],
# academictransfer[:2]). Entries past the sixth are documentation only.
# "statistics" leads because it is the word this field owns; "data science"
# and "machine learning" follow because a large share of these posts use those
# instead — but they are deliberately NOT first, since they also return the
# computer_science board's entire catalogue.
- statistics
- biostatistics
- data science
- statistical modelling
- machine learning
- causal inference
- bayesian statistics
- time series
- probability
- experimental design
weights:
  core_title: 5.0
  core_desc: 2.5
  context_title: 1.0
  context_desc: 0.5
  negative: -2.0
threshold: 2.0
require_title_anchor: true
supervisor_source: openalex
supervisor_ads_db: general
supervisor_arxiv_cat: stat.*,cs.LG,math.ST

# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 26 (Mathematics) — where OpenAlex files statistics. Topic ids
# read from the live topics API on 2026-08-20 — real ids, not guessed. The
# machine-learning topics are drawn from field 17 (Computer Science) on
# purpose: this field straddles the two, and ranking authors on statistics
# topics alone would miss the statistical-ML side entirely.
# supervisor_senior_signal is 'none': statistics and ML papers order authors
# alphabetically often enough that last-author would pick the wrong person.
supervisor_field: 26
supervisor_topics:
  - T10136   # Statistical Methods and Inference
  - T10243   # Statistical Methods and Bayesian Inference
  - T11871   # Advanced Statistical Methods and Models
  - T13500   # Probability and Statistical Research
  - T10845   # Advanced Causal Inference Techniques
  - T11303   # Bayesian Modeling and Causal Inference
  - T12205   # Time Series Analysis and Forecasting
  - T11270   # Complex Systems and Time Series Analysis
  - T11714   # Multimodal Machine Learning Applications
  - T11689   # Adversarial Robustness in Machine Learning
  - T12254   # Machine Learning in Bioinformatics
  - T10181   # Natural Language Processing Techniques
supervisor_senior_signal: none

# NOTE ON PER-BOARD TARGETING. Unlike the older field files, this one carries
# NO source_options block. Every EURAXESS facet and AJO category for the fields
# added on 2026-08-20 lives in sources/url_registry.yaml and only there —
# because source_options SILENTLY OVERRIDE the registry, and duplicating the
# values here is exactly how six existing fields drifted onto AJO's fallback
# page while the registry sat corrected. One home, no drift.

subfields:
  methodology:
    label: Statistical Methodology & Inference
    topics: [T10136, T11871]
    keywords:
    - statistical inference
    - nonparametric
    - high-dimensional
    - asymptotic
    - model selection
    - estimator
  bayesian:
    label: Bayesian Statistics
    topics: [T10243, T11303]
    keywords:
    # "prior"/"posterior" alone are matched as SUBSTRINGS by the supervisor and
    # match filters (field_profile_keywords), where they hit "prior to" and
    # "posterior" in anatomy. The distribution phrases say the same thing and
    # cannot misfire.
    - bayesian
    - MCMC
    - variational inference
    - prior distribution
    - posterior distribution
    - gaussian process
  causal:
    label: Causal Inference
    topics: [T10845, T11303]
    keywords:
    - causal inference
    - counterfactual
    - confounding
    - randomised trial
    - causal discovery
  probability:
    label: Probability & Stochastic Processes
    topics: [T13500]
    keywords:
    - probability theory
    - stochastic process
    - markov chain
    - random matrix
    - limit theorem
  time_series_spatial:
    label: Time Series & Spatial Statistics
    topics: [T12205, T11270]
    keywords:
    - time series
    - forecasting
    - state space model
    - spatial statistics
    - spatio-temporal
    - geostatistics
  biostatistics:
    label: Biostatistics
    topics: [T12254, T10136]
    keywords:
    - biostatistics
    - survival analysis
    - clinical trial
    - longitudinal data
    - epidemiology
    - statistical genetics
  statistical_ml:
    label: Statistical Machine Learning
    topics: [T11714, T11689, T10181]
    keywords:
    - statistical machine learning
    - deep learning
    - representation learning
    - kernel method
    - graphical model
    - uncertainty quantification

# The university-department sweep is OFF for this field, deliberately.
# source_uni_departments falls back to the BUILT-IN ASTRONOMY registry (150
# sites) for any profile with no `departments:` key at all — so leaving this
# out would make a run of this field crawl 150 astronomy department pages,
# slowly, for nothing. An explicit empty list disables the source cleanly
# instead ("active field profile has no departments — skipping").
# Replace with a real curated list to turn the source on for this field.
departments: []
