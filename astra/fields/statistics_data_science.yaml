# fields/statistics_data_science.yaml — statistics & data science (statistical
# methodology and inference, Bayesian and causal methods, probability and
# stochastic processes, biostatistics, statistical machine learning, and the
# applied data-science posts that sit between them)
# =============================================================================
# Matching rules (see the relevance engine in astra.py):
#   * lowercase terms match case-insensitively as PREFIXES
#     ("statistic" catches statistics/statistical/statistician);
#     spaces and hyphens are interchangeable.
#   * ALL-CAPS terms (<= 6 chars) match as case-SENSITIVE whole words.
#
#   core_anchors    a post MUST match >= 1 of these to qualify at all
#   context_terms   boost the score but can never qualify a post alone
#   negative_terms  demote a post (ignored when a core anchor is in the title)
#   search_terms    typed into each job board's own search box (coverage)
#   weights/threshold  the scoring rule: keep iff >=1 anchor AND score >= threshold
#   subfields       used by --find-supervisors --field <subfield> --country X
#
# WHY require_title_anchor IS ON HERE — do not turn it off casually.
# "machine learning" and "data analysis" now appear in the description of PhD
# ads in every discipline on the board: they are literally context_terms in
# biology.yaml, materials_science.yaml, neuroscience.yaml and environmental_
# science.yaml. Without the title gate, a single description-only mention
# scores 2.5 against a 2.0 threshold, so this profile would quietly collect the
# whole board. computer_science.yaml sets the same flag for the same reason.
# The cost is real and accepted: a genuinely statistical post whose title never
# says so will be missed.
#
# OVERLAP NOTE. This field RE-SLICES rather than expands — 311 Statistics is a
# child of 298 Mathematics and 251 Information science is already claimed by
# computer_science, so on EURAXESS it reaches nothing those two could not.
# What it buys is a searcher who wants statistics not having to wade through
# either pure maths or software engineering. Its new reach comes from the
# general boards and from AJO, where the stat + Data Science cluster is the
# second densest thing on the board. See docs/BOARD_TAXONOMIES.md.
# =============================================================================
