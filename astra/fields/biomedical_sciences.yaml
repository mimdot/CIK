# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 27 (Medicine). Topic ids read from the live topics API on
# 2026-08-20 — real ids, not guessed. Field 27 is huge (692 topics), so these
# are chosen for spread across the subfields below rather than by raw works
# count, which would return only obstetrics and epidemiology.
supervisor_field: 27
supervisor_topics:
  - T10158   # Cancer Immunotherapy and Biomarkers
  - T11112   # Viral Infections and Immunology Research
  - T10031   # T-cell and B-cell Immunology
  - T10038   # Tuberculosis Research and Epidemiology
  - T10522   # Medical Imaging Techniques and Applications
  - T12422   # Radiomics and Machine Learning in Medical Imaging
  - T12264   # Tissue Engineering and Regenerative Medicine
  - T11651   # Inhalation and Respiratory Drug Delivery
  - T10256   # Drug Solubulity and Delivery Systems
  - T10351   # Liver Disease Diagnosis and Treatment
  - T11930   # Cardiac, Anesthesia and Surgical Outcomes
  - T12935   # Healthcare Systems and Public Health
  - T14495   # Public Health and Nutrition
  - T10261   # Genetic Associations and Epidemiology
  - T12552   # Fetal and Pediatric Neurological Disorders
supervisor_senior_signal: last_author

# NOTE ON PER-BOARD TARGETING. Unlike the older field files, this one carries
