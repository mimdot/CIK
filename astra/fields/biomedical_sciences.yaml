# fields/biomedical_sciences.yaml — biomedical & health sciences (translational
# and clinical research, immunology, oncology, infectious disease, epidemiology
# and public health, pharmacology and drug discovery, medical imaging,
# regenerative medicine, medical devices and health data ...)
# =============================================================================
# Matching rules (see the relevance engine in astra.py):
#   * lowercase terms match case-insensitively as PREFIXES
#     ("immunolog" catches immunology/immunological);
#     spaces and hyphens are interchangeable.
#   * ALL-CAPS terms (<= 6 chars) match as case-SENSITIVE whole words.
#
#   core_anchors    a post MUST match >= 1 of these to qualify at all
#   context_terms   boost the score but can never qualify a post alone
#   negative_terms  demote a post (ignored when a core anchor is in the title)
#   search_terms    typed into each job board's own search box (coverage)
#   weights/threshold  the scoring rule: keep iff >=1 anchor AND score >= threshold
#   subfields       used by --find-supervisors --field <subfield> --country X
#   departments     the uni_departments sweep-list
#
# OVERLAP NOTE. This is the LARGEST unclaimed EURAXESS block (313 Medical
# sciences + 6037 Health sciences — see docs/BOARD_TAXONOMIES.md), which is
# exactly why it also overlaps fields/biology.yaml (immunology, cancer, stem
# cells) and fields/neuroscience.yaml (neurology, psychiatry). That overlap is
# intentional and harmless: one run loads one profile. What negative_terms
# guards against is the physical sciences and pure-software leakage.
# =============================================================================
