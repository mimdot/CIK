# fields/astronomy.yaml — the reference field profile (astronomy/astrophysics)
# =============================================================================
# This file drives WHAT the aggregator considers relevant. Edit YAML, not
# Python. Select at runtime with:  python astra.py --field astronomy
# (this profile is also the default). To target a different research field,
# copy template.yaml, fill it in, and pass --field <yourname>.
#
# Matching rules (see the relevance engine in astra.py):
#   * lowercase terms match case-insensitively as PREFIXES
#     ("astrophysic" catches astrophysics/astrophysical/astrophysicist);
#     spaces and hyphens are interchangeable.
#   * ALL-CAPS terms (<= 6 chars) match as case-SENSITIVE whole words
#     ("ISM" does not fire inside "mechanism").
#
#   core_anchors    a post MUST match >= 1 of these to qualify at all
#   context_terms   boost the score but can never qualify a post alone
#   negative_terms  demote a post (ignored when a core anchor is in the title)
#   search_terms    typed into each job board's own search box (coverage)
#   weights/threshold  the scoring rule: keep iff >=1 anchor AND score >= threshold
#   subfields       used by --find-supervisors --field <subfield> --country X
# =============================================================================
