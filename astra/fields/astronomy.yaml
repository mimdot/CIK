# Literature corpus for the supervisor finder (--find-supervisors).
# supervisor_source: auto | openalex | ads | arxiv.
#   auto     = ADS for astronomy/physics, OpenAlex for every other major
#   openalex = OpenAlex (covers ANY field, no token)
#   ads      = NASA ADS (best index for astronomy; needs ADS_API_TOKEN)
#   arxiv    = arXiv only
# supervisor_ads_db: ADS database facet — astronomy | physics | general (=arXiv).
# supervisor_arxiv_cat: arXiv category filter for the tokenless fallback.
supervisor_source: ads
supervisor_ads_db: astronomy
supervisor_arxiv_cat: astro-ph*

# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 31 = "Physics and Astronomy". ADS stays the primary source
# for astronomy, but these topics enable the author-direct OpenAlex fallback
# (h-index + recent-activity ranking) if ADS is unavailable or returns nothing.
supervisor_field: 31
supervisor_topics:
  - T12917   # Astronomy and Astrophysical Research
  - T10744   # Astrophysical Phenomena and Observations
  - T10039   # Stellar, planetary, and galactic studies
  - T10026   # Galaxies: Formation, Evolution, Phenomena
  - T10477   # Astrophysics and Star Formation Studies
  - T10818   # Astrophysics and Cosmic Phenomena
  - T10095   # Cosmology and Gravitation Theories
  - T10025   # Black Holes and Theoretical Physics
  - T11323   # Gamma-ray bursts and supernovae
  - T10406   # Planetary Science and Exploration
  - T10325   # Astro and Planetary Science


# Per-source query knobs for THIS discipline (verified live 2026-08-14).
#   euraxess.research_fields          EURAXESS `job_research_field` facet IDs
#   euraxess.adjacent_research_fields one extra PhD-scoped sweep of a
#                                     neighbouring subject
#   academicjobsonline.categories     /ajo/<category> listing pages
source_options:
  euraxess:
    research_fields: [34, 35, 37]
    adjacent_research_fields: [345]
  academicjobsonline:
    categories: ['physics/Astronomy', 'physics/Astrophysics']

