# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex fields 31 (Physics) + 25 (Materials Science). ADS stays primary,
# but these topics enable the author-direct OpenAlex fallback.
supervisor_field: 31
supervisor_topics:
  - T10037   # Physics of Superconductivity and Magnetism
  - T10083   # Graphene research and applications
  - T10275   # 2D Materials and Applications
  - T10079   # Nanoparticles: synthesis and applications
  - T10107   # Ferroelectric and Piezoelectric Materials
  - T10022   # Semiconductor Quantum Structures and Devices
  - T10657   # Topological Materials and Phenomena
  - T10660   # Conducting polymers and applications
  - T10132   # Advanced ceramic materials synthesis
  - T10097   # Luminescence Properties of Advanced Materials
  - T12039   # Electron and X-Ray Spectroscopy Techniques
  - T10389   # Polymer crystallization and properties
  - T11242   # Nuclear Materials and Properties


# Per-source query knobs for THIS discipline (verified live 2026-08-14).
#   euraxess.research_fields          EURAXESS `job_research_field` facet IDs
#   euraxess.adjacent_research_fields one extra PhD-scoped sweep of a
#                                     neighbouring subject
#   academicjobsonline.categories     /ajo/<category> listing pages
source_options:
  euraxess:
    research_fields: [345]
    adjacent_research_fields: [47]
  # academicjobsonline: REMOVED 2026-08-20. This block said ['physics'], which
  # is a REAL page but the wrong one — the whole 36k-character Physics listing
  # rather than the Condensed Matter Physics subcategory (15k, measured), so
  # this field was silently reusing all of physics. Because source_options
  # override the registry it was winning over the corrected
  # ['physics/Condensed Matter Physics'] in url_registry.yaml. The registry
  # entry is now the only definition — do not re-add it here.

subfields:

  quantum_materials:
    label: Quantum Materials
    keywords:
      - quantum materials
      - strongly correlated electrons
      - Mott insulator
      - heavy fermion
      - Kondo lattice
      - topological insulator
      - Weyl semimetal
      - charge density wave
      - spin liquid
      - quantum criticality

  superconductivity_magnetism:
