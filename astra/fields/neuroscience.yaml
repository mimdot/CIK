# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 28 (Neuroscience). Topic ids read from
# api.openalex.org/topics?filter=field.id:fields/28 on 2026-08-20 — real ids,
# not guessed. supervisor_senior_signal follows the wet-lab convention: the PI
# is the last author.
supervisor_field: 28
supervisor_topics:
