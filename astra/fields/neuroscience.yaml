  - T10581   # Neural dynamics and brain function
  - T10241   # Functional Brain Connectivity Studies
  - T10429   # EEG and Brain-Computer Interfaces
  - T10427   # Visual perception and processing mechanisms
  - T10056   # Neurotransmitter Receptor Influence on Behavior
  - T10423   # Neurobiology and Insect Physiology Research
  - T10971   # Olfactory and Sensory Function Studies
