# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 19 = "Earth and Planetary Sciences". supervisor_topics drive
# the AUTHOR index query — real researchers ranked by h-index and recent
# activity.
supervisor_field: 19
supervisor_topics:
  - T10017   # Geology and Paleoclimatology Research
  - T10001   # Geological and Geochemical Analysis
  - T11405   # Geophysics and Gravity Measurements
  - T11757   # Seismic Waves and Analysis
  - T10271   # Seismic Imaging and Inversion Techniques
  - T10110   # earthquake and tectonic studies
  - T10572   # Geophysical and Geoelectrical Methods
  - T10965   # Geological formations and processes
  - T13443   # Mineralogy and Gemology Studies
  - T10398   # Groundwater and Isotope Geochemistry
  - T12083   # Karst Systems and Hydrogeology
  - T13067   # Geological Modeling and Analysis
  - T12424   # Earthquake Detection and Analysis
  - T10644   # Cryospheric studies and observations
  - T11333   # Climate change and permafrost
  - T10955   # Paleontology and Evolutionary Biology
  - T10109   # Paleontology and Stratigraphy of Fossils
supervisor_senior_signal: last_author


# Per-source query knobs for THIS discipline (verified live 2026-08-14).
#   euraxess.research_fields          EURAXESS `job_research_field` facet IDs
#   euraxess.adjacent_research_fields one extra PhD-scoped sweep of a
#                                     neighbouring subject
#   academicjobsonline.categories     /ajo/<category> listing pages
source_options:
  euraxess:
    research_fields: [219]
    adjacent_research_fields: [195]
  # academicjobsonline: REMOVED 2026-08-20. This block said ['geosciences'],
