# fields/environmental_science.yaml — environmental science (ecology &
# conservation, climate and global change, atmospheric science and air quality,
# surface hydrology and water resources, soil and biogeochemistry, pollution
# and ecotoxicology, sustainability and environmental policy ...)
# =============================================================================
# Matching rules (see the relevance engine in astra.py):
#   * lowercase terms match case-insensitively as PREFIXES
#     ("ecolog" catches ecology/ecological/ecologist);
#     spaces and hyphens are interchangeable.
#   * ALL-CAPS terms (<= 6 chars) match as case-SENSITIVE whole words.
#
#   core_anchors    a post MUST match >= 1 of these to qualify at all
#   context_terms   boost the score but can never qualify a post alone
#   negative_terms  demote a post (ignored when a core anchor is in the title)
#   search_terms    typed into each job board's own search box (coverage)
#   weights/threshold  the scoring rule: keep iff >=1 anchor AND score >= threshold
#   subfields       used by --find-supervisors --field <subfield> --country X
#   departments     the uni_departments sweep-list
#
# BOUNDARY WITH THE EXISTING GEO FIELDS — read before editing.
# fields/geology.yaml owns solid earth (stratigraphy, tectonics, palaeontology)
# and fields/geophysics_hydro.yaml owns the SUBSURFACE (hydrogeology,
# groundwater, aquifers, seismics). This file takes SURFACE environment:
# catchments, streamflow, water quality, air, soil, ecosystems, climate.
# The split is enforced by putting the subsurface vocabulary in negative_terms
# below, so a groundwater post ranks for geophysics_hydro and not for this
# field. On EURAXESS the two are genuinely different parents — 195
# Environmental science here, 219 Geosciences there — so they do not compete
# for the same listings either. See docs/BOARD_TAXONOMIES.md.
# =============================================================================
