# fields/materials_science.yaml — materials science & engineering (metals and
# alloys, ceramics, polymers and soft matter, composites, thin films and
# surfaces, nanomaterials, energy materials, biomaterials, characterisation and
# computational materials ...)
# =============================================================================
# Matching rules (see the relevance engine in astra.py):
#   * lowercase terms match case-insensitively as PREFIXES
#     ("metallurg" catches metallurgy/metallurgical/metallurgist);
#     spaces and hyphens are interchangeable.
#   * ALL-CAPS terms (<= 6 chars) match as case-SENSITIVE whole words.
#
#   core_anchors    a post MUST match >= 1 of these to qualify at all
#   context_terms   boost the score but can never qualify a post alone
#   negative_terms  demote a post (ignored when a core anchor is in the title)
#   search_terms    typed into each job board's own search box (coverage)
#   weights/threshold  the scoring rule: keep iff >=1 anchor AND score >= threshold
#   subfields       used by --find-supervisors --field <subfield> --country X
#   departments     the uni_departments sweep-list
#
# THIS FIELD RE-SLICES RATHER THAN EXPANDS on EURAXESS — read before tuning.
# Its facets (181 Materials engineering, 428 Nanotechnology, 361 Solid state
# physics) are all CHILDREN of parents that engineering.yaml and physics.yaml
# already claim, so it surfaces no listing those two could not already reach.
# What it buys is precision: a materials PhD no longer arrives buried in a
# generic "Engineering" run. Its genuinely NEW reach comes from the general
# boards being queried with the search_terms below. See
# docs/BOARD_TAXONOMIES.md.
#
# Neighbours to keep an eye on: condensed_matter.yaml (superconductivity,
# strongly correlated systems, soft matter theory) and chemistry.yaml
# (synthesis, catalysis, electrochemistry). Overlap there is real and
# deliberate — the negative_terms only push back the clearly-not-materials.
# =============================================================================
