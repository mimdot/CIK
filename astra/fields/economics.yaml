# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# supervisor_field:      OpenAlex field id — 20 = "Economics, Econometrics and
#                        Finance" (drives topic curation, not the query filter).
# supervisor_topics:     curated OpenAlex topic ids used to find SUPERVISORS
#                        directly in the OpenAlex AUTHOR index (topics.id OR-ed
#                        + a country filter), instead of keyword-matched papers.
# supervisor_senior_signal: economics/finance order authors alphabetically, so
#                        a "last author = PI" bonus would be wrong — 'none'.
supervisor_field: 20
supervisor_topics:
  - T11742   # Economic Theory and Policy
  - T10128   # Global trade and economics
  - T11770   # Fiscal Policy and Economic Growth
  - T10007   # Monetary Policy and Economic Impact
  - T10047   # Financial Markets and Investment Strategies
  - T10208   # Labor market dynamics and wage inequality
  - T11059   # Market Dynamics and Volatility
  - T10067   # Stochastic processes and financial applications
  - T12137   # Economic theories and models
  - T10991   # Game Theory and Voting Systems
  - T10393   # Economic Growth and Productivity
  - T12394   # Insurance and Financial Risk Management
  - T10282   # Financial Risk and Volatility Modeling
  - T11043   # Merger and Competition Analysis
supervisor_senior_signal: none


# Per-source query knobs for THIS discipline (verified live 2026-08-14).
#   euraxess.research_fields          EURAXESS `job_research_field` facet IDs
#   euraxess.adjacent_research_fields one extra PhD-scoped sweep of a
#                                     neighbouring subject
#   academicjobsonline.categories     /ajo/<category> listing pages
source_options:
  euraxess:
    research_fields: [117]
    adjacent_research_fields: [298]
  academicjobsonline:
    categories: ['economics']

