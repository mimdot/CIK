# --- supervisor finder: author-direct search (OpenAlex) ----------------------
# OpenAlex field 19 = "Earth and Planetary Sciences". ADS stays primary, but
# these topics enable the author-direct OpenAlex fallback.
supervisor_field: 19
supervisor_topics:
  - T11405   # Geophysics and Gravity Measurements
  - T11757   # Seismic Waves and Analysis
  - T10271   # Seismic Imaging and Inversion Techniques
  - T10110   # earthquake and tectonic studies
  - T10572   # Geophysical and Geoelectrical Methods
  - T12424   # Earthquake Detection and Analysis
  - T10398   # Groundwater and Isotope Geochemistry
  - T12083   # Karst Systems and Hydrogeology
  - T10644   # Cryospheric studies and observations
  - T11333   # Climate change and permafrost
  - T10466   # Meteorological Phenomena and Simulations
  - T11061   # Ocean Waves and Remote Sensing


# Per-source query knobs for THIS discipline (verified live 2026-08-14).
#   euraxess.research_fields          EURAXESS `job_research_field` facet IDs
#   euraxess.adjacent_research_fields one extra PhD-scoped sweep of a
#                                     neighbouring subject
#   academicjobsonline.categories     /ajo/<category> listing pages
source_options:
  euraxess:
    research_fields: [219, 345]
    adjacent_research_fields: [195]
  # academicjobsonline: REMOVED 2026-08-20. This block said ['geosciences'],
  # which is AJO's generic fallback page, and because source_options OVERRIDE
  # the registry it was winning over the corrected ['ES'] in url_registry.yaml.
  # The registry entry is now the only definition — do not re-add it here.

subfields:
  hydrogeology:
    label: Hydrogeology and groundwater
    keywords:
      - groundwater flow
      - aquifer characterization
      - hydraulic conductivity
      - contaminant transport
      - groundwater recharge
      - MODFLOW
      - pumping test
      - vadose zone
      - reactive transport
      - hydrogeology

  environmental_geophysics:
    label: Environmental and near-surface geophysics
    keywords:
      - electrical resistivity tomography
      - induced polarization
      - ground penetrating radar
      - near surface geophysics
      - self potential
      - hydrogeophysics
      - contaminant plume
      - geoelectrical imaging
      - time lapse ERT
      - borehole geophysics

  seismology:
    label: Seismology and crustal imaging
    keywords:
      - seismic tomography
      - passive seismic
      - ambient noise tomography
      - receiver function
      - earthquake source
      - seismic anisotropy
      - crustal structure
      - mantle structure
      - full waveform inversion
      - microseismic

  geodynamics_geodesy:
    label: Geodynamics and geodesy
    keywords:
      - crustal deformation
      - InSAR
      - GNSS
      - plate tectonics
      - lithosphere
      - mantle convection
      - geodynamics
      - tectonic deformation
      - gravity inversion
      - geodetic modeling
