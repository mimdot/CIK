# fields/template.yaml — starter profile for a NEW research field
# =============================================================================
# HOW TO USE
#   1. cp fields/template.yaml fields/marine_biology.yaml   (any name works)
#   2. Fill in the lists below for YOUR field.
#   3. Run:  python astra.py --field marine_biology
#
# You do NOT touch any Python. The aggregator's relevance engine, position-
# type classifier, freshness layer and dedupe all work unchanged — only the
# subject-matter knowledge lives here.
#
# MATCHING RULES
#   * lowercase terms match case-insensitively as PREFIXES — "oceanograph"
#     catches oceanography/oceanographic/oceanographer. Spaces and hyphens
#     are interchangeable ("coral-reef" == "coral reef").
#   * ALL-CAPS terms of <= 6 characters match as case-SENSITIVE whole words —
#     use this for acronyms ("AUV" won't fire inside "flAUVor"... you get it).
# =============================================================================

