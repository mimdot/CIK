name: go

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    name: Backend (self-test + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            astra/requirements.txt
            astra/requirements-dev.txt
      - name: Install backend deps
        # requirements-dev.txt pulls in requirements.txt AND the test runner.
        # Installing only the runtime manifest is what made this job fail with
        # "No module named pytest" — the suite never ran at all.
        run: pip install -r astra/requirements-dev.txt
      - name: Offline CLI self-test
        run: cd astra && python3 astra.py --self-test
      - name: Backend tests
        run: cd astra && python3 -m pytest tests/ -q

  frontend:
    name: Dashboard (test + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python3 -m venv /tmp/a && /tmp/a/bin/pip install -q pip-audit \
            && /tmp/a/bin/pip-audit -r astra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - name: npm audit
        working-directory: dashboard
        run: npm audit --audit-level=high

  deploy:
    name: Release job (pinned build, non-root, deps of prod overlay)
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: echo "Release tag ${{ github.ref_name }} passed all gates."
      - run: echo "Configure deploy here (e.g. trigger PROVISIONING.md steps on the beta VPS)."