name: Tauri Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Tauri App
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'career-intelligence-linux'
            tauri_target: ''
          # macOS Intel
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            artifact_name: 'career-intelligence-macos-x64'
            tauri_target: '--target x86_64-apple-darwin'
          # macOS Apple Silicon
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'career-intelligence-macos-arm64'
            tauri_target: '--target aarch64-apple-darwin'
          # Windows
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'career-intelligence-windows'
            tauri_target: '--target x86_64-pc-windows-msvc'
            sidecar_suffix: '.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            python3-pip

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 webkit2gtk-4.1

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # WebView2 is required for Tauri on Windows
          # It's typically pre-installed on Windows 10/11, but we ensure it
          # by downloading the Evergreen bootstrapper if needed
          echo "WebView2 should be available on Windows 10/11"
          # Install Python for PyInstaller
          choco install python --version=3.12 -y

      - name: Cache Tauri dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            dashboard/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('dashboard/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build FastAPI sidecar (PyInstaller)
        working-directory: phd_aggregator
        run: |
          pip install --break-system-packages pyinstaller
          pyinstaller cik-api.spec
          mkdir -p ../dashboard/src-tauri/sidecar/api
          SUFFIX="${{ matrix.sidecar_suffix }}"
          cp dist/cik-api ../dashboard/src-tauri/sidecar/api/cik-api-${{ matrix.target }}$SUFFIX
          chmod +x ../dashboard/src-tauri/sidecar/api/cik-api-${{ matrix.target }}$SUFFIX

      - name: Build Tauri App
        working-directory: dashboard
        run: |
          npm run tauri build ${{ matrix.tauri_target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}