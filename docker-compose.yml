services:
  # Optional PostgreSQL backend. Enabled with:
  #   docker-compose -f docker-compose.yml -f docker-compose.postgres.yml up
  # or by overriding DATABASE_URL to point at an external PG instance.
  postgres:
    image: postgres:16-alpine
    container_name: cik-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cik}
      POSTGRES_DB: ${POSTGRES_DB:-cik}
    volumes:
      - cik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cik}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cik-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/phd_data.db}
      CIK_SECRET_KEY: ${CIK_SECRET_KEY:?Set CIK_SECRET_KEY in .env}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      ADS_API_TOKEN: ${ADS_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - cik-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: cik-redis
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cik-worker
    profiles: ["redis"]
    command: ["rq", "worker", "default"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/phd_data.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      ADS_API_TOKEN: ${ADS_API_TOKEN:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      CIK_SECRET_KEY: ${CIK_SECRET_KEY:?Set CIK_SECRET_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - cik-data:/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cik-dashboard
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

volumes:
  cik-data:
  cik-pgdata:
